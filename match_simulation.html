<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Simulation</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/match_simulation.css">
    <script src="src/match_simulation.js" type="module"></script>
</head>
<body>
    <div class="container">
        <div class="match-details">
            <div class="team-info">
                <img id="team1-logo" src="" alt="Team 1 Logo">
                <h2 id="team1-name"></h2>
            </div>
            <div class="score-display">
                <span id="score1">0</span> - <span id="score2">0</span>
            </div>
            <div class="team-info">
                <img id="team2-logo" src="" alt="Team 2 Logo">
                <h2 id="team2-name"></h2>
            </div>
        </div>

        <!-- Map Selection Section -->
        <div class="map-selection-container" id="map-selection-container">
            <h3>Map Selection</h3>
            <div id="map-pool" class="map-pool"></div>
            <div id="current-map-status" class="map-status"></div>
        </div>

        <div id="current-map-display" style="display: none;">
            <h3>Current Map: <span id="current-map-name"></span></h3>
            <div class="map-image-container" style="text-align: center;">
                <img id="current-map-image" src="" alt="Current Map Image" style="width: 100%; max-width: 600px; margin-top: 10px; border-radius: 8px;">
            </div>
        </div>

        <!-- Simulation UI -->
        <div class="simulation-ui" id="simulation-ui" style="display: none; margin-top: 20px;">
            <div class="team-player-selection">
                <div class="team1-players">
                    <h4><span id="t1-name-display"></span> Roster</h4>
                    <div id="team1-roster" class="player-roster"></div>
                    <h4>Active Players</h4>
                    <div id="team1-active-players" class="active-players"></div>
                </div>
                <div class="team2-players">
                    <h4><span id="t2-name-display"></span> Roster</h4>
                    <div id="team2-roster" class="player-roster"></div>
                    <h4>Active Players</h4>
                    <div id="team2-active-players" class="active-players"></div>
                </div>
            </div>

            <div class="match-logs-container" style="margin-top: 20px; background: var(--bg-sidebar); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
                <h3 style="color: var(--v-red); text-transform: uppercase; font-family: var(--font-v); font-size: 1.2em;">Match Logs</h3>
                <div id="match-logs" style="height: 200px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 0.9em; color: var(--v-white); padding: 10px; background: rgba(0,0,0,0.3); border-radius: 4px;">
                    <div class="log-entry">Waiting for round to start...</div>
                </div>
            </div>
        </div>

        <div class="match-results">
            <h2 id="match-winner"></h2>
            <div class="game-controls">
                <button id="next-round" style="display: none;">Start Round</button>
                <button id="return-to-bracket">Return to Bracket</button>
            </div>
        </div>
    </div>
</body>
</html>
