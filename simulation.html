<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Simulation Engine</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="src/simulation.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0f1923;
            color: #ece8e1;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1, h2, h3 {
            color: #ff4655;
        }
        .team-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .team {
            width: 48%;
            background-color: #1f2731;
            border-radius: 5px;
            padding: 15px;
        }
        .player-card {
            background-color: #263747;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .player-name {
            font-weight: bold;
            color: #ece8e1;
        }
        .player-role {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8em;
        }
        .duelist { background-color: #ff4655; color: white; }
        .initiator { background-color: #00c2b8; color: white; }
        .controller { background-color: #7e6ee6; color: white; }
        .sentinel { background-color: #ffb800; color: white; }
        
        .player-stats {
            display: flex;
            flex-wrap: wrap;
        }
        .stat {
            width: 30%;
            margin-right: 3%;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 0.8em;
            color: #8b978f;
        }
        .stat-value {
            font-weight: bold;
        }
        
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #ff4655;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #e6323f;
        }
        
        .simulation-log {
            background-color: #1f2731;
            border-radius: 5px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin-bottom: 5px;
            border-left: 3px solid #8b978f;
            padding-left: 10px;
        }
        .round-header {
            color: #ff4655;
            font-weight: bold;
            margin-top: 10px;
        }
        .kill-log {
            color: #ffb800;
        }
        .strategy-log {
            color: #00c2b8;
        }
        .score-log {
            color: #7e6ee6;
            font-weight: bold;
        }
        
        .scoreboard {
            display: flex;
            justify-content: space-between;
            background-color: #1f2731;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .team-score {
            font-size: 24px;
            font-weight: bold;
        }
        .team-name {
            margin-bottom: 5px;
        }
        
        .player-stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .player-stats-table th, .player-stats-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #263747;
        }
        .player-stats-table th {
            background-color: #263747;
            color: #ece8e1;
        }
        .player-stats-table tr:nth-child(even) {
            background-color: #1a212b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Valorant Simulation Engine</h1>
        
        <div class="controls">
            <button id="generate-teams">Generate Teams</button>
            <button id="simulate-round">Simulate Round</button>
            <button id="simulate-match">Simulate Match</button>
            <button id="reset">Reset</button>
        </div>
        
        <div class="scoreboard">
            <div>
                <div class="team-name" id="team1-name">Team 1</div>
                <div class="team-score" id="team1-score">0</div>
            </div>
            <div>
                <div class="team-name" id="team2-name">Team 2</div>
                <div class="team-score" id="team2-score">0</div>
            </div>
        </div>
        
        <div class="team-container">
            <div class="team" id="team1">
                <h2>Team 1</h2>
                <div id="team1-players"></div>
            </div>
            
            <div class="team" id="team2">
                <h2>Team 2</h2>
                <div id="team2-players"></div>
            </div>
        </div>
        
        <h2>Simulation Log</h2>
        <div class="simulation-log" id="simulation-log"></div>
        
        <h2>Player Statistics</h2>
        <table class="player-stats-table" id="player-stats-table">
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Team</th>
                    <th>Role</th>
                    <th>K</th>
                    <th>D</th>
                    <th>A</th>
                    <th>FK</th>
                    <th>FD</th>
                    <th>Rating</th>
                </tr>
            </thead>
            <tbody id="stats-body">
                <!-- Player stats will be inserted here -->
            </tbody>
        </table>
    </div>

    <script type="module">
         import { PlayerRating, ROLES, WEAPONS, SHIELDS, Player, Team, EconomySystem, RoundSimulator, MatchSimulator } from './src/simulation.js';
         
         // Global variables
        let team1 = null;
        let team2 = null;
        let currentRound = 1;
        
        // DOM elements
        const generateTeamsBtn = document.getElementById('generate-teams');
        const simulateRoundBtn = document.getElementById('simulate-round');
        const simulateMatchBtn = document.getElementById('simulate-match');
        const team1PlayersEl = document.getElementById('team1-players');
        const team2PlayersEl = document.getElementById('team2-players');
        const team1NameEl = document.getElementById('team1-name');
        const team2NameEl = document.getElementById('team2-name');
        const team1ScoreEl = document.getElementById('team1-score');
        const team2ScoreEl = document.getElementById('team2-score');
        const logsEl = document.getElementById('simulation-log');
        const statsBodyEl = document.getElementById('stats-body');
        const resetBtn = document.getElementById('reset');
        
        // Initialize
        simulateRoundBtn.disabled = true;
        simulateMatchBtn.disabled = true;
        
        // Reset simulation
        resetBtn.addEventListener('click', function() {
            team1 = null;
            team2 = null;
            currentRound = 1;
            
            team1NameEl.textContent = 'Team 1';
            team2NameEl.textContent = 'Team 2';
            team1ScoreEl.textContent = '0';
            team2ScoreEl.textContent = '0';
            
            team1PlayersEl.innerHTML = '';
            team2PlayersEl.innerHTML = '';
            logsEl.innerHTML = '';
            statsBodyEl.innerHTML = '';
            
            simulateRoundBtn.disabled = true;
            simulateMatchBtn.disabled = true;
            
            addLog('Simulation reset.');
        });
        
        // Generate teams
        generateTeamsBtn.addEventListener('click', function() {
            // Create teams with 5 players each
            team1 = new Team("Team A");
            team1.switchSide('attack');
            team2 = new Team("Team B");
            team2.switchSide('defense');
            
            // Generate 5 random players for each team
            for (let i = 0; i < 5; i++) {
                team1.addPlayer(new Player());
                team2.addPlayer(new Player());
            }
            
            // Update UI
            updateTeamDisplay();
            updateScoreboard();
            
            // Enable simulation buttons
            simulateRoundBtn.disabled = false;
            simulateMatchBtn.disabled = false;
            
            // Clear logs
            logsEl.innerHTML = '';
            addLog('Teams generated successfully!');
        });
        
        // Simulate round
        simulateRoundBtn.addEventListener('click', function() {
            if (!team1 || !team2) return;
            
            // Create round simulator
            const roundSim = new RoundSimulator(
                team1.side === 'attack' ? team1 : team2,
                team1.side === 'defense' ? team1 : team2,
                currentRound,
                []
            );
            
            // Simulate round
            const result = roundSim.simulateRound();
            
            // Update logs
            result.logs.forEach(log => addLog(log));
            
            // Update UI
            updateScoreboard();
            updatePlayerStats();
            
            // Increment round counter
            currentRound++;
            
            // Check for side switch
            if (currentRound === 13) {
                team1.switchSide(team1.side === 'attack' ? 'defense' : 'attack');
                team2.switchSide(team2.side === 'attack' ? 'defense' : 'attack');
                addLog('Teams switched sides!');
            }
            
            // Check for match end
            if (team1.score >= 13 || team2.score >= 13) {
                const winner = team1.score >= 13 ? team1 : team2;
                addLog(`Match ended! ${winner.name} wins ${winner.score}-${winner === team1 ? team2.score : team1.score}!`);
                simulateRoundBtn.disabled = true;
            }
        });
        
        // Simulate match
        simulateMatchBtn.addEventListener('click', function() {
            if (!team1 || !team2) return;
            
            // Reset match state
            team1.score = 0;
            team2.score = 0;
            currentRound = 1;
            
            // Set initial sides
            team1.switchSide('attack');
            team2.switchSide('defense');
            
            // Create match simulator
            const matchSim = new MatchSimulator(team1, team2, []);
            
            // Simulate match
            const result = matchSim.simulateMatch();
            
            // Update logs
            result.logs.forEach(log => addLog(log));
            
            // Update UI
            updateScoreboard();
            updatePlayerStats();
            
            // Disable round simulation button
            simulateRoundBtn.disabled = true;
        });
        
        // Helper functions
        function updateTeamDisplay() {
            team1NameEl.textContent = team1.name;
            team2NameEl.textContent = team2.name;
            
            team1PlayersEl.innerHTML = '';
            team2PlayersEl.innerHTML = '';
            
            team1.players.forEach(player => {
                team1PlayersEl.appendChild(createPlayerCard(player));
            });
            
            team2.players.forEach(player => {
                team2PlayersEl.appendChild(createPlayerCard(player));
            });
        }
        
        function createPlayerCard(player) {
            const card = document.createElement('div');
            card.className = 'player-card';
            
            const header = document.createElement('div');
            header.className = 'player-header';
            
            const name = document.createElement('div');
            name.className = 'player-name';
            name.textContent = player.gamertag;
            
            const role = document.createElement('div');
            role.className = 'player-role';
            role.textContent = player.role;
            role.style.backgroundColor = getRoleColor(player.role);
            
            header.appendChild(name);
            header.appendChild(role);
            
            const stats = document.createElement('div');
            stats.className = 'player-stats';
            stats.innerHTML = `
                <div>Rating: ${player.rating.getOverallRating().toFixed(1)}</div>
                <div>K/D/A: ${player.kills}/${player.deaths}/${player.assists}</div>
            `;
            
            card.appendChild(header);
            card.appendChild(stats);
            
            return card;
        }
        
        function getRoleColor(role) {
            const colors = {
                'Duelist': '#ff4655',
                'Initiator': '#ece8e1',
                'Controller': '#18e4b7',
                'Sentinel': '#bd3fbe'
            };
            return colors[role] || '#ece8e1';
        }
        
        function updateScoreboard() {
            team1ScoreEl.textContent = team1.score;
            team2ScoreEl.textContent = team2.score;
        }
        
        function updatePlayerStats() {
            statsBodyEl.innerHTML = '';
            
            // Add team 1 players
            team1.players.forEach(player => {
                addPlayerStatsRow(player, team1.name);
            });
            
            // Add team 2 players
            team2.players.forEach(player => {
                addPlayerStatsRow(player, team2.name);
            });
        }
        
        function addPlayerStatsRow(player, teamName) {
            const row = document.createElement('tr');
            
            const nameCell = document.createElement('td');
            nameCell.textContent = player.gamertag;
            
            const teamCell = document.createElement('td');
            teamCell.textContent = teamName;
            
            const roleCell = document.createElement('td');
            roleCell.textContent = player.role;
            
            const killsCell = document.createElement('td');
            killsCell.textContent = player.kills;
            
            const deathsCell = document.createElement('td');
            deathsCell.textContent = player.deaths;
            
            const assistsCell = document.createElement('td');
            assistsCell.textContent = player.assists;
            
            const kdaCell = document.createElement('td');
            const kda = player.deaths === 0 ? player.kills : (player.kills / player.deaths).toFixed(2);
            kdaCell.textContent = kda;
            
            row.appendChild(nameCell);
            row.appendChild(teamCell);
            row.appendChild(roleCell);
            row.appendChild(killsCell);
            row.appendChild(deathsCell);
            row.appendChild(assistsCell);
            row.appendChild(kdaCell);
            
            statsBodyEl.appendChild(row);
        }
        
        function addLog(text) {
             const log = document.createElement('div');
             log.className = 'log-entry';
             log.textContent = text;
             logsEl.appendChild(log);
             logsEl.scrollTop = logsEl.scrollHeight;
         }
    </script>
</body>
</html>
